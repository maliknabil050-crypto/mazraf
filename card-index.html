<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فهد الزهراني | البطاقة الرقمية</title>
  <style>
    :root {
      --bg-color: #0d0f18;
      --accent: #38bdf8; /* لون إضاءة سماوي فاخر */
      --accent-glow: rgba(56, 189, 248, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
      color: #F9FAFB;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* حاوية الكارت الزجاجي الشفاف مع الهالة والحواف اللامعة */
    .card-container {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 35px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  0 0 30px rgba(56, 189, 248, 0.2); /* هالة خفيفة للكارت */
      position: relative;
      overflow: hidden;
      animation: floatCard 6s ease-in-out infinite;
    }

    /* تأثير الحواف اللامعة المتحركة */
    .card-container::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, transparent, rgba(56, 189, 248, 0.6), transparent, rgba(168, 85, 247, 0.6), transparent);
      border-radius: 30px;
      z-index: -1;
      animation: borderGlow 4s linear infinite;
    }

    @keyframes borderGlow {
      0% { opacity: 0.5; filter: hue-rotate(0deg); }
      50% { opacity: 1; filter: hue-rotate(180deg); }
      100% { opacity: 0.5; filter: hue-rotate(360deg); }
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* الصورة الشخصية أو الأيقونة */
    .avatar-wrapper {
      width: 90px;
      height: 90px;
      margin: 0 auto 16px auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      padding: 3px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: #fff;
    }

    .name {
      font-size: 1.5rem;
      font-weight: 800;
      color: #FFF;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .title-role {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    /* قائمة الأزرار */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #FFF;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .contact-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-icon {
      font-size: 1.2rem;
    }

    .arrow-icon {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .contact-btn:hover .arrow-icon {
      color: var(--accent);
      transform: translateX(-3px);
      transition: 0.2s;
    }

    .card-footer {
      margin-top: 25px;
      font-size: 0.72rem;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 15px;
    }

    .card-footer strong {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- الأيقونة أو الحرف الأول -->
    <div class="avatar-wrapper">
      <div class="avatar">ف</div>
    </div>

    <div class="name">فهد الزهراني</div>
    <div class="title-role">البطاقة الرقمية التفاعلية</div>

    <div class="links-list">
      <!-- 1. زر الاتصال المباشر -->
      <a href="tel:0569999699" class="contact-btn">
        <div class="btn-content">
          <span class="btn-icon">📞</span>
          <span>اتصال مباشر</span>
        </div>
        <span class="arrow-icon">←</span>
      </a>

      <!-- 2. زر الواتساب -->
      <a href="https://wa.me/966569999699?text=مرحباً أستاذ فهد، تواصلت معك عبر بطاقتك الرقمية" target="_blank" class="contact-btn">
        <div class="btn-content">
          <span class="btn-icon">💬</span>
          <span>محادثة واتساب</span>
        </div>
        <span class="arrow-icon">←</span>
      </a>

      <!-- 3. زر سناب شات -->
      <a href="https://www.snapchat.com" target="_blank" class="contact-btn">
        <div class="btn-content">
          <span class="btn-icon">👻</span>
          <span>سناب شات</span>
        </div>
        <span class="arrow-icon">←</span>
      </a>

      <!-- 4. زر منصة إكس -->
      <a href="https://x.com" target="_blank" class="contact-btn">
        <div class="btn-content">
          <span class="btn-icon">🅧</span>
          <span>منصة إكس (Twitter)</span>
        </div>
        <span class="arrow-icon">←</span>
      </a>

      <!-- 5. زر البريد الإلكتروني -->
      <a href="mailto:fahad@example.com" class="contact-btn">
        <div class="btn-content">
          <span class="btn-icon">✉️</span>
          <span>البريد الإلكتروني</span>
        </div>
        <span class="arrow-icon">←</span>
      </a>
    </div>

    <div class="card-footer">
      تصميم الهوية الرقمية: <strong>نبيل النمر</strong> © 2026
    </div>

  </div>

</body>
</html>
